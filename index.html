<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cypher AI — Pronósticos Deportivos</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --panel-2: #141e33;
      --border: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #00e5ff;
      --purple: #a855f7;
      --green: #10b981;
      --red: #f43f5e;
      --amber: #f59e0b;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #111d38 0%, var(--bg) 54%);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding-bottom: 86px;
    }

    /* CABECERA FIJA CON BOTONES DE DEPORTES */
    header {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(7, 11, 20, 0.92);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 9px;
    }
    .header-top {
      max-width: 1120px; margin: 0 auto 9px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .brand h1 { font-size: 0.98rem; letter-spacing: 0.4px; font-weight: 800; line-height: 1.1; }
    .brand span { display: block; font-size: 0.65rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .sync-pill {
      font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border);
      padding: 5px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
    .btn {
      background: linear-gradient(135deg, var(--cyan), var(--green));
      color: #03131b; border: none; border-radius: 8px;
      padding: 6px 11px; font-weight: 700; font-size: 0.74rem; cursor: pointer;
    }
    .btn-ghost {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    }

    .header-sports {
      max-width: 1120px; margin: 0 auto;
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
    }
    .header-sports::-webkit-scrollbar { display: none; }
    .sport-pill {
      background: var(--panel); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 13px; border-radius: 999px; font-size: 0.76rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: 0.16s; flex-shrink: 0;
    }
    .sport-pill.active {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #050a14; border-color: transparent; box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }

    main { max-width: 1120px; margin: 0 auto; padding: 14px 14px 18px; }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .desktop-tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab-btn {
      background: var(--panel); color: var(--muted); border: 1px solid var(--border);
      padding: 8px 13px; border-radius: 10px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: 0.16s;
    }
    .tab-btn.active {
      background: rgba(0, 229, 255, 0.12); color: var(--cyan); border-color: rgba(0, 229, 255, 0.45);
    }
    .search-input {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; min-width: 210px; flex: 0 1 260px;
    }
    @media (max-width: 720px) {
      .desktop-tabs { display: none; }
      .search-input { width: 100%; flex: 1 1 100%; }
      .sync-pill .ts-text { display: none; }
    }

    /* TARJETAS DE PARTIDOS */
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(316px, 1fr)); gap: 13px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, #0b1222 100%);
      border: 1px solid var(--border); border-radius: 16px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .badge {
      font-family: var(--mono); font-size: 0.67rem; font-weight: 700;
      padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
      background: rgba(0, 229, 255, 0.12); color: var(--cyan);
    }
    .badge.green { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .badge.red { background: rgba(244, 63, 94, 0.15); color: var(--red); }
    .badge.amber { background: rgba(245, 158, 11, 0.15); color: var(--amber); }
    .badge.purple { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; }

    /* BLOQUE ESCUDO VS ESCUDO */
    .matchup-banner {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      background: rgba(15, 23, 42, 0.60); border: 1px solid rgba(148, 163, 184, 0.10);
      border-radius: 12px; padding: 12px 8px;
    }
    .team-col {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    }
    .team-logo {
      width: 48px; height: 48px; object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.55));
    }
    .team-logo.round {
      border-radius: 50%; object-fit: cover; background: var(--panel-2);
      border: 2px solid rgba(0, 229, 255, 0.35);
    }
    .team-name { font-size: 0.83rem; font-weight: 700; line-height: 1.2; }
    .team-role { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .vs-pill {
      font-family: var(--mono); font-size: 0.68rem; font-weight: 800; color: var(--cyan);
      background: rgba(0, 229, 255, 0.10); border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 4px 8px; border-radius: 999px; text-transform: uppercase;
    }

    /* CAJAS CLARAS DE PICK #1 Y PICK #2 */
    .picks-stack { display: flex; flex-direction: column; gap: 7px; }
    .pick-tier {
      border-radius: 11px; padding: 9px 11px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .pick-tier.primary {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.11), rgba(16, 185, 129, 0.08));
      border: 1px solid rgba(0, 229, 255, 0.32);
      border-left: 3.5px solid var(--cyan);
    }
    .pick-tier.secondary {
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-left: 3.5px solid var(--purple);
    }
    .tier-head {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      font-size: 0.67rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .pick-tier.primary .tier-head { color: var(--cyan); }
    .pick-tier.secondary .tier-head { color: #d8b4fe; }
    .prob-chip {
      font-family: var(--mono); font-size: 0.68rem; font-weight: 800;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.18); color: var(--green);
    }
    .tier-val { font-size: 0.9rem; font-weight: 800; color: var(--text); line-height: 1.25; }

    .pick-extra-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 0.73rem; color: var(--muted); padding-top: 2px;
    }
    .extra-pill {
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 7px; color: #cbd5e1; font-size: 0.72rem;
    }

    /* BLOQUE DIAMANTE */
    .diamond-wrap { display: grid; gap: 10px; margin-bottom: 14px; }
    .diamond-card {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.09), rgba(168, 85, 247, 0.09));
      border: 1px solid rgba(0, 229, 255, 0.35); border-radius: 14px; padding: 14px;
    }
    .diamond-card.nobet {
      background: rgba(148, 163, 184, 0.06); border-color: rgba(148, 163, 184, 0.28);
    }
    .diamond-title { font-size: 0.92rem; font-weight: 800; color: var(--cyan); margin-bottom: 6px; }
    .diamond-card.nobet .diamond-title { color: #cbd5e1; }
    .rich-text { font-size: 0.81rem; color: #dbe5f4; line-height: 1.5; white-space: pre-line; }
    .rich-field {
      margin-top: 8px; background: rgba(7, 11, 20, 0.55); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px;
    }
    .rich-field-title { font-size: 0.74rem; font-weight: 800; color: var(--amber); margin-bottom: 4px; }

    /* TARJETAS DE JUGADORES (PROPS) CON FOTO */
    .prop-card {
      background: linear-gradient(180deg, var(--panel) 0%, #0b1222 100%);
      border: 1px solid var(--border); border-radius: 14px; padding: 12px 13px;
      display: flex; align-items: center; gap: 12px;
    }
    .player-avatar {
      width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
      object-fit: cover; object-position: top center;
      background: radial-gradient(circle, #1e293b 0%, #090f1d 100%);
      border: 2px solid rgba(168, 85, 247, 0.55);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.22);
    }
    .player-avatar.logo-mode { object-fit: contain; padding: 5px; border-color: rgba(0, 229, 255, 0.45); }
    .prop-body { flex: 1; min-width: 0; }
    .prop-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; }
    .prop-player { font-size: 0.88rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prop-pick {
      font-size: 0.82rem; font-weight: 700; color: var(--cyan);
      background: var(--panel-2); padding: 6px 9px; border-radius: 8px; margin-bottom: 5px;
    }
    .prop-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); }

    /* LÍNEAS INICIALES */
    .line-box {
      background: var(--panel-2); border-radius: 10px; padding: 9px 11px;
      display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem;
    }
    .line-box b { color: var(--cyan); }

    /* TABLAS Y SECCIONES */
    .section-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; margin-bottom: 14px; overflow-x: auto;
    }
    .section-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
    th, td { text-align: left; padding: 9px 7px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px; }
    td.mono { font-family: var(--mono); }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .cyan { color: var(--cyan); }

    .empty-state {
      background: var(--panel); border: 1px dashed var(--border); border-radius: 14px;
      padding: 28px 18px; text-align: center; color: var(--muted); font-size: 0.84rem; line-height: 1.5;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* BARRA COMPACTA DE KPIs HASTA LA PARTE MÁS BAJA */
    .kpi-footer {
      max-width: 1120px; margin: 16px auto 0; padding: 0 14px;
    }
    .kpi-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
      background: rgba(15, 23, 42, 0.74); border: 1px solid var(--border);
      border-radius: 12px; padding: 7px 9px;
    }
    @media (max-width: 640px) {
      .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 6px 8px; }
    }
    .kpi-mini {
      display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
      background: rgba(7, 11, 20, 0.55); border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 8px; padding: 6px 9px;
    }
    .kpi-mini-lbl { font-size: 0.63rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .kpi-mini-val { font-family: var(--mono); font-size: 0.86rem; font-weight: 800; }

    /* NAV INFERIOR MÓVIL */
    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(7, 11, 20, 0.96); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border); padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(5, 1fr); gap: 2px;
    }
    .m-btn {
      background: none; border: none; color: var(--muted); font-size: 0.65rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; cursor: pointer;
    }
    .m-btn.active { color: var(--cyan); }
    @media (max-width: 720px) { .mobile-nav { display: grid; } }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <img src="./assets/icon.svg" alt="Cypher AI" />
        <div>
          <h1>CYPHER AI</h1>
          <span>Pronósticos Inteligentes</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="sync-pill"><span class="dot"></span><span class="ts-text" id="updatedAt">Actualizando...</span></div>
        <button class="btn-ghost" id="btnRefresh" title="Actualizar datos">↻</button>
        <button class="btn" id="btnInstall" style="display:none;">Instalar</button>
      </div>
    </div>

    <!-- BOTONES DE DEPORTES EN CABECERA -->
    <div class="header-sports" id="sportPills">
      <button class="sport-pill active" data-sport="ALL">⚡ Todos</button>
      <button class="sport-pill" data-sport="NBA">🏀 NBA</button>
      <button class="sport-pill" data-sport="NFL">🏈 NFL</button>
      <button class="sport-pill" data-sport="SOCCER">⚽ Soccer</button>
      <button class="sport-pill" data-sport="TENNIS">🎾 Tenis</button>
      <button class="sport-pill" data-sport="MLB">⚾ MLB</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="desktop-tabs">
        <button class="tab-btn active" data-view="picks">🎯 Pronósticos</button>
        <button class="tab-btn" data-view="props">🌟 Jugadores</button>
        <button class="tab-btn" data-view="guiones">🎬 Combinadas</button>
        <button class="tab-btn" data-view="aperturas">📸 Líneas Iniciales</button>
        <button class="tab-btn" data-view="roi">📈 Resultados</button>
      </div>
      <input class="search-input" id="searchInput" type="search" placeholder="Buscar equipo, jugador o liga..." />
    </div>

    <!-- VISTA 1: DIAMANTE + PRONÓSTICOS (#1 Y #2 MÁS PROBABLE) -->
    <section id="view-picks" class="view active">
      <div id="diamanteContainer" class="diamond-wrap"></div>
      <div id="picksContainer" class="cards-grid"></div>
    </section>

    <!-- VISTA 2: JUGADORES (PROPS CON FOTO) -->
    <section id="view-props" class="view">
      <div id="propsResumenContainer" class="diamond-wrap"></div>
      <div id="propsContainer" class="cards-grid"></div>
    </section>

    <!-- VISTA 3: COMBINADAS (GUIONES SGP) -->
    <section id="view-guiones" class="view">
      <div id="guionesContainer" class="cards-grid"></div>
    </section>

    <!-- VISTA 4: LÍNEAS INICIALES (APERTURAS RLM) -->
    <section id="view-aperturas" class="view">
      <div id="aperturasContainer" class="cards-grid"></div>
    </section>

    <!-- VISTA 5: RESULTADOS, GANANCIAS Y MOTORES -->
    <section id="view-roi" class="view">
      <div class="section-box">
        <div class="section-title"><span>Evolución de Ganancias (Unidades)</span><span class="mono cyan" id="chartMax"></span></div>
        <div id="equityChart"></div>
      </div>
      <div class="section-box">
        <div class="section-title"><span>Efectividad por Deporte</span></div>
        <table>
          <thead><tr><th>Deporte</th><th>Ganados - Perdidos</th><th>Efectividad</th><th>Ganancia</th><th>ROI</th></tr></thead>
          <tbody id="sportSummaryBody"></tbody>
        </table>
      </div>
      <div class="section-box">
        <div class="section-title"><span>Historial Verificado (Últimos 80)</span></div>
        <table>
          <thead><tr><th>Fecha</th><th>Dep</th><th>Partido</th><th>Pronóstico</th><th>Cuota</th><th>Resultado</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div id="enginesContainer" class="cards-grid"></div>
    </section>
  </main>

  <!-- BARRA COMPACTA DE KPIs HASTA LA PARTE MÁS BAJA -->
  <footer class="kpi-footer">
    <div class="kpi-strip">
      <div class="kpi-mini"><span class="kpi-mini-lbl">ROI Global</span><span class="kpi-mini-val cyan" id="kpiRoi">0.0%</span></div>
      <div class="kpi-mini"><span class="kpi-mini-lbl">Ganancia</span><span class="kpi-mini-val" id="kpiUnits">+0.00 U</span></div>
      <div class="kpi-mini"><span class="kpi-mini-lbl">Juegos Hoy</span><span class="kpi-mini-val cyan" id="kpiPicksHoy">0</span></div>
      <div class="kpi-mini"><span class="kpi-mini-lbl">Líneas RLM</span><span class="kpi-mini-val pos" id="kpiAperturas">0</span></div>
    </div>
  </footer>

  <nav class="mobile-nav">
    <button class="m-btn active" data-view="picks"><span>🎯</span><span>Picks</span></button>
    <button class="m-btn" data-view="props"><span>🌟</span><span>Jugadores</span></button>
    <button class="m-btn" data-view="guiones"><span>🎬</span><span>Combos</span></button>
    <button class="m-btn" data-view="aperturas"><span>📸</span><span>Líneas</span></button>
    <button class="m-btn" data-view="roi"><span>📈</span><span>Balance</span></button>
  </nav>

  <script>
    let DATA = null;
    let activeView = 'picks';
    let activeSport = 'ALL';
    let searchTerm = '';
    let deferredPrompt = null;

    const icons = { NBA: '🏀', NFL: '🏈', SOCCER: '⚽', TENNIS: '🎾', MLB: '⚾' };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const cleanMd = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code style="color:#00e5ff;font-family:var(--mono)">$1</code>');

    function iniciales(nombre) {
      const p = String(nombre || '?').trim().split(/\s+/).filter(Boolean);
      return ((p[0]?.[0] || '') + (p[p.length - 1]?.[0] || '')).toUpperCase().slice(0, 2) || 'AI';
    }

    function fallbackSvg(nombre, redondo = false) {
      const ini = iniciales(nombre);
      const svg = redondo
        ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#162035"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#00e5ff" font-family="sans-serif" font-weight="800" font-size="22">${ini}</text></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 L56 14 V32 C56 47 45 56 32 61 C19 56 8 47 8 32 V14 Z" fill="#162035" stroke="#00e5ff" stroke-width="3"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-weight="800" font-size="20">${ini}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function imgTag(url, nombre, clase, redondo = false) {
      const fb = fallbackSvg(nombre, redondo);
      return `<img class="${clase}" src="${esc(url || fb)}" alt="${esc(nombre)}" loading="lazy" onerror="this.onerror=null;this.src='${fb}'" />`;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e;
      document.getElementById('btnInstall').style.display = 'inline-block';
    });
    document.getElementById('btnInstall').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt(); await deferredPrompt.userChoice;
      deferredPrompt = null; document.getElementById('btnInstall').style.display = 'none';
    });

    function switchView(v) {
      activeView = v;
      document.querySelectorAll('.view').forEach((el) => el.classList.toggle('active', el.id === `view-${v}`));
      document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === v));
      renderAll();
    }
    document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.view)));

    document.querySelectorAll('#sportPills .sport-pill').forEach((p) =>
      p.addEventListener('click', () => {
        activeSport = p.dataset.sport;
        document.querySelectorAll('#sportPills .sport-pill').forEach((x) => x.classList.toggle('active', x === p));
        renderAll();
      })
    );

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim().toLowerCase();
      renderAll();
    });
    document.getElementById('btnRefresh').addEventListener('click', () => cargarDatos(true));

    function filtrar(lista) {
      return (lista || []).filter((it) => {
        if (activeSport !== 'ALL' && it.deporte !== activeSport) return false;
        if (!searchTerm) return true;
        return JSON.stringify(it).toLowerCase().includes(searchTerm);
      });
    }

    function matchupHTML(item) {
      const a = item.equipo_a || (item.duelo || '').split(/\s+(?:@|vs)\s+/i)[0] || 'Equipo A';
      const b = item.equipo_b || (item.duelo || '').split(/\s+(?:@|vs)\s+/i)[1] || 'Equipo B';
      const sep = item.separador || (item.deporte === 'SOCCER' || item.deporte === 'TENNIS' ? 'vs' : '@');
      const esTenis = item.deporte === 'TENNIS';
      const cls = esTenis ? 'team-logo round' : 'team-logo';
      const rolA = sep === '@' ? 'Visita' : (esTenis ? 'Jugador A' : 'Local');
      const rolB = sep === '@' ? 'Local' : (esTenis ? 'Jugador B' : 'Visita');
      return `
        <div class="matchup-banner">
          <div class="team-col">
            ${imgTag(item.logo_a, a, cls, esTenis)}
            <div class="team-name">${esc(a)}</div>
            <div class="team-role">${rolA}</div>
          </div>
          <div class="vs-pill">VS</div>
          <div class="team-col">
            ${imgTag(item.logo_b, b, cls, esTenis)}
            <div class="team-name">${esc(b)}</div>
            <div class="team-role">${rolB}</div>
          </div>
        </div>`;
    }

    function renderPickCard(p) {
      const p1 = p.pick_1 || { etiqueta: 'Ganador', texto: p.pick_principal || '-', prob: null };
      const p2 = p.pick_2 || null;
      const p3 = p.pick_3 || null;
      const prob1 = p1.prob ? `<span class="prob-chip">${Number(p1.prob).toFixed(1)}% prob.</span>` : '';
      const prob2 = p2 && p2.prob ? `<span class="prob-chip">${Number(p2.prob).toFixed(1)}% prob.</span>` : '';

      return `
        <article class="card">
          <div class="card-top">
            <span class="badge">${icons[p.deporte] || ''} ${esc(p.liga)}</span>
            <span class="badge amber">Cuota ${Number(p.cuota).toFixed(2)}</span>
          </div>
          ${matchupHTML(p)}
          <div class="picks-stack">
            <div class="pick-tier primary">
              <div class="tier-head">
                <span>🥇 Pick #1 • ${esc(p1.etiqueta)}</span>
                ${prob1}
              </div>
              <div class="tier-val">${esc(p1.texto)}</div>
            </div>
            ${p2 ? `
            <div class="pick-tier secondary">
              <div class="tier-head">
                <span>🥈 Pick #2 • ${esc(p2.etiqueta)}</span>
                ${prob2}
              </div>
              <div class="tier-val">${esc(p2.texto)}</div>
            </div>` : ''}
          </div>
          <div class="pick-extra-row">
            ${p3 ? `<span class="extra-pill"><b>${esc(p3.etiqueta)}:</b> ${esc(p3.texto)}${p3.prob ? ` (${Number(p3.prob).toFixed(0)}%)` : ''}</span>` : '<span></span>'}
            <span>${esc(p.fecha)}</span>
          </div>
        </article>`;
    }

    function renderEquityChart(curva) {
      const box = document.getElementById('equityChart');
      if (!curva || curva.length < 2) {
        box.innerHTML = '<div class="empty-state">La gráfica de ganancias se dibujará automáticamente cuando se cierren al menos 2 jornadas.</div>';
        return;
      }
      const w = 800, h = 175, pad = 22;
      const vals = curva.map((d) => d.unidades);
      const minV = Math.min(0, ...vals), maxV = Math.max(1, ...vals);
      const span = Math.max(0.5, maxV - minV);
      const pts = curva.map((d, i) => {
        const x = pad + (i / (curva.length - 1)) * (w - pad * 2);
        const y = h - pad - ((d.unidades - minV) / span) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const yZero = h - pad - ((0 - minV) / span) * (h - pad * 2);
      const ult = vals[vals.length - 1];
      document.getElementById('chartMax').textContent = `${ult >= 0 ? '+' : ''}${ult.toFixed(2)} U`;
      box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        <line x1="${pad}" y1="${yZero}" x2="${w - pad}" y2="${yZero}" stroke="rgba(148,163,184,0.25)" stroke-dasharray="4 4"/>
        <polyline fill="none" stroke="${ult >= 0 ? '#10b981' : '#f43f5e'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>
      </svg>`;
    }

    function renderAll() {
      if (!DATA) return;
      const k = DATA.kpis;
      document.getElementById('updatedAt').textContent = DATA.updated_at || '-';

      const roiEl = document.getElementById('kpiRoi');
      roiEl.textContent = `${k.roi_global >= 0 ? '+' : ''}${k.roi_global.toFixed(1)}%`;
      roiEl.className = `kpi-mini-val ${k.roi_global >= 0 ? 'pos' : 'neg'}`;
      const uEl = document.getElementById('kpiUnits');
      uEl.textContent = `${k.unidades_netas >= 0 ? '+' : ''}${k.unidades_netas.toFixed(2)} U`;
      uEl.className = `kpi-mini-val ${k.unidades_netas >= 0 ? 'pos' : 'neg'}`;
      document.getElementById('kpiPicksHoy').textContent = k.picks_hoy;
      document.getElementById('kpiAperturas').textContent = k.aperturas_activas;

      // 1. Diamante + Pronósticos
      const diams = filtrar(DATA.diamantes);
      document.getElementById('diamanteContainer').innerHTML = diams.map((d) => `
        <div class="diamond-card ${d.es_no_bet ? 'nobet' : ''}">
          <div class="diamond-title">${icons[d.deporte] || '💎'} ${esc(d.titulo)}</div>
          <div class="rich-text">${cleanMd(d.descripcion)}</div>
          ${(d.campos || []).map((c) => `
            <div class="rich-field">
              <div class="rich-field-title">${esc(c.titulo)}</div>
              <div class="rich-text">${cleanMd(c.valor)}</div>
            </div>`).join('')}
        </div>`).join('');

      const picks = filtrar(DATA.picks_hoy);
      document.getElementById('picksContainer').innerHTML = picks.length
        ? picks.map(renderPickCard).join('')
        : `<div class="empty-state" style="grid-column:1/-1;">Todavía no se publican los pronósticos finales de este deporte hoy.<br/>Puedes consultar los partidos programados en <b>📸 Líneas Iniciales</b>.</div>`;

      // 2. Jugadores (Props con foto)
      const pRes = filtrar(DATA.props_resumenes);
      document.getElementById('propsResumenContainer').innerHTML = pRes.map((r) => `
        <div class="diamond-card">
          <div class="diamond-title">💎 Mejores Selecciones de Jugadores — ${icons[r.deporte] || ''} ${esc(r.deporte)}</div>
          <div class="rich-text">${cleanMd(r.texto)}</div>
        </div>`).join('');

      const props = filtrar(DATA.props);
      document.getElementById('propsContainer').innerHTML = props.length ? props.map((pr) => `
        <article class="prop-card">
          ${imgTag(pr.foto, pr.jugador, pr.es_equipo ? 'player-avatar logo-mode' : 'player-avatar', !pr.es_equipo)}
          <div class="prop-body">
            <div class="prop-head">
              <div class="prop-player">${esc(pr.jugador)}</div>
              <span class="badge purple">${pr.probabilidad ? pr.probabilidad.toFixed(1) + '% prob.' : pr.deporte}</span>
            </div>
            <div class="prop-pick">${esc(pr.pick)}</div>
            <div class="prop-foot">
              <span>${icons[pr.deporte] || ''} ${esc(pr.partido)}</span>
              <span>Últimos 5: ${esc(pr.racha_l5 || '—')}</span>
            </div>
          </div>
        </article>`).join('') :
        `<div class="empty-state" style="grid-column:1/-1;">Las selecciones de jugadores con foto aparecerán aquí automáticamente en cuanto termine el siguiente análisis del día.</div>`;

      // 3. Combinadas (Guiones SGP)
      const guiones = filtrar(DATA.guiones);
      document.getElementById('guionesContainer').innerHTML = guiones.length ? guiones.map((g) => `
        <article class="card">
          <div class="card-top">
            <span class="badge purple">${icons[g.deporte] || '🎬'} Combinada ${esc(g.deporte)}</span>
          </div>
          <div class="diamond-title" style="font-size:0.88rem;margin:0;">${esc(g.titulo)}</div>
          <div class="rich-text">${cleanMd(g.valor)}</div>
        </article>`).join('') :
        `<div class="empty-state" style="grid-column:1/-1;">Aún no hay combinadas sugeridas para este deporte hoy.</div>`;

      // 4. Líneas Iniciales (Aperturas RLM)
      const aps = filtrar(DATA.aperturas);
      document.getElementById('aperturasContainer').innerHTML = aps.length ? aps.map((a) => `
        <article class="card">
          <div class="card-top">
            <span class="badge">${icons[a.deporte] || ''} ${esc(a.liga)}</span>
            <span class="badge green">${esc(a.casino)}</span>
          </div>
          ${matchupHTML(a)}
          <div class="line-box">
            <div>${esc(a.linea_1)}</div>
            <div>${esc(a.linea_2)}</div>
          </div>
          <div class="pick-extra-row">
            <span>Partido: ${esc(a.fecha)}</span>
            <span>Registro: ${esc((a.captura || '').slice(0, 16))}</span>
          </div>
        </article>`).join('') :
        `<div class="empty-state" style="grid-column:1/-1;">No hay líneas iniciales registradas para este deporte.</div>`;

      // 5. Resultados y Motores
      renderEquityChart(DATA.curva_banca);
      document.getElementById('sportSummaryBody').innerHTML = Object.entries(DATA.resumen_deportes || {}).map(([dep, v]) => `
        <tr>
          <td><b>${icons[dep] || ''} ${dep}</b></td>
          <td class="mono">${v.ganados} - ${v.perdidos}</td>
          <td class="mono">${v.win_rate.toFixed(1)}%</td>
          <td class="mono ${v.unidades >= 0 ? 'pos' : 'neg'}">${v.unidades >= 0 ? '+' : ''}${v.unidades.toFixed(2)} U</td>
          <td class="mono ${v.roi >= 0 ? 'pos' : 'neg'}">${v.roi >= 0 ? '+' : ''}${v.roi.toFixed(1)}%</td>
        </tr>`).join('');

      const hist = filtrar(DATA.historial);
      document.getElementById('historyBody').innerHTML = hist.length ? hist.map((h) => `
        <tr>
          <td class="mono">${esc(h.fecha)}</td>
          <td>${icons[h.deporte] || ''}</td>
          <td>${esc(h.duelo)}</td>
          <td>${esc(h.pick_principal)}</td>
          <td class="mono">${Number(h.cuota).toFixed(2)}</td>
          <td><span class="badge ${h.estado === 'Ganado' ? 'green' : 'red'}">${esc(h.estado)} (${h.ganancia >= 0 ? '+' : ''}${Number(h.ganancia).toFixed(2)}U)</span></td>
        </tr>`).join('') :
        `<tr><td colspan="6" style="text-align:center;color:var(--muted);">Aún sin resultados cerrados para este filtro.</td></tr>`;

      document.getElementById('enginesContainer').innerHTML = (DATA.motores || []).map((m) => `
        <article class="card">
          <div class="card-top"><span class="badge">${icons[m.deporte] || ''} ${esc(m.deporte)} ${esc(m.version)}</span><span class="badge green">ACTIVO</span></div>
          <div style="font-size:0.86rem;font-weight:700;">${esc(m.horario)}</div>
          <div class="pick-extra-row"><span>${esc(m.modulo)}</span></div>
        </article>`).join('');
    }

    async function cargarDatos(force = false) {
      try {
        const res = await fetch(`./data/dashboard.json${force ? '?t=' + Date.now() : ''}`, { cache: 'no-store' });
        DATA = await res.json();
        renderAll();
      } catch (e) {
        document.getElementById('updatedAt').textContent = 'Sin conexión';
      }
    }

    cargarDatos();
  </script>
</body>
</html>
